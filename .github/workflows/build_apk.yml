      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build APKs
        run: |
          gradle assembleDebug
          mkdir -p out
          cp app/build/outputs/apk/collection/debug/*.apk out/OperateNow_16in1_Collection.apk
          for f in app/build/outputs/apk/game*/debug/*.apk; do
            cp "$f" "out/OperateNow_$(basename "$f" | sed 's/app-//;s/-debug//')"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Operate Now! 16款手术安卓版"
          files: out/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OperateNow_Android_APKs
          path: out/*.apk
