自己将源文件重制封装为安卓 .apk 的技术要点
保留 content/ 目录下的完整同级文件：解压上述 .zip 后，你会看到除主 .swf 之外，同级或子目录下还带有多语言配置 .xml（很多款自带官方中文语言包 Chinese）及外部素材文件；封装进安卓工程的 assets/ 目录时，请将 .swf 与同目录的所有附属文件一并放入，这样加载到 100% 时才能正常读取语言包进入主菜单（详见 Flashpoint 打包结构文档）。

伪造本地虚拟域名绕过 SiteLock 校验：由于多数游戏的 .swf 会校验运行域名是否为 http://www8.agame.com/，如果你用安卓原生 WebView + Ruffle WebAssembly 自托管组件 来打包 APK，只需在安卓代码中使用 WebViewAssetLoader（或拦截 shouldInterceptRequest）将本地 assets/content/www8.agame.com/ 映射为 http://www8.agame.com/，即可在不反编译修改 .swf 源码的情况下直接通过域名检测。

或使用反编译工具直接移除域名锁：如果你想用 Adobe AIR SDK（或 Harman AIR 64-bit SDK）把它们直接编译成原生 64 位安卓 .apk，可以用开源的 JPEXS Free Flash Decompiler (FFDec) 打开包内的 .swf，将启动脚本里的域名检测判断直接改为 true 后保存即可。

