name: Auto Build Operate Now 16 APKs

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Unpack Android Project Template
        run: |
          echo "" | base64 -d > project.zip
          unzip -q -o project.zip
          mv OperateNow_Android_Builder/* .
          rm -rf OperateNow_Android_Builder project.zip

      - name: 2. Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Download All 16 Operate Now Game ZIPs & Ruffle Engine
        run: python3 fetch_and_prepare_assets.py

      - name: 4. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 6. Compile 16-in-1 Collection APK & 16 Standalone APKs
        run: |
          gradle assembleDebug
          mkdir -p release_apks
          cp app/build/outputs/apk/collection/debug/app-collection-debug.apk release_apks/OperateNow_16in1_Collection.apk
          for f in app/build/outputs/apk/game*/debug/*.apk; do
            base=$(basename "$f" | sed 's/app-//;s/-debug//')
            cp "$f" "release_apks/OperateNow_${base}"
          done
          ls -lh release_apks/

      - name: 7. Publish APKs to GitHub Releases (Direct Phone Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Operate Now! 16款手术游戏安卓版 (16合1总集 + 16个独立APK)"
          body: "点击下方 Assets 中的 .apk 文件即可直接在安卓手机上下载安装：\n- `OperateNow_16in1_Collection.apk`：16合1选关大厅总集版\n- `OperateNow_game01_scoliosis.apk` ~ `OperateNow_game16_dental.apk`：16款独立安装包"
          files: release_apks/*.apk
          prerelease: false

      - name: 8. Upload APKs to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OperateNow_Android_APKs
          path: release_apks/*.apk
